name: CI Workflow

on:
    push:
        branches: main
        tags: v*
    pull_request:
        branches: main
jobs:
    Node_CI_pipeline:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7.0.0
              with:
                  node-version: 24
            - name: Install dependencies
              run: npm install
            - name: Run linter
              run: npm run lint
            - name: Run unit tests
              run: npm test
    Deploy:
            needs: Node_CI_pipeline
            if: github.ref == 'refs/heads/main' && github.event_name == 'push'
            runs-on: ubuntu-latest
            steps:
                - name: Render deployment
                  env:
                    deploy_url: ${{ secrets.RENDER_DEPLOY_HOOK }}
                  run: curl $deploy_url
