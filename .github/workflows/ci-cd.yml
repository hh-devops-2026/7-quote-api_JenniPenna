name: CI Workflow

on:
    push:
        branches: main
        tags: v*
    pull_request:
        branches: main
jobs:
    Node_CI_pipeline:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7.0.0
              with:
                  node-version: 24
            - name: Install dependencies
              run: npm install
            - name: Run linter
              run: npm run lint
            - name: Run unit tests
              run: npm test
